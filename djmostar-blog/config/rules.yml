# Hard rules checked by code. A single failure blocks publishing.
# Phrases are matched without regard to upper or lower case.
forbidden_phrases:
  - Musik, die aus einem Moment eine Erinnerung macht
  - unvergessliche Momente
  - unvergesslich
  - in der heutigen schnelllebigen Zeit
  - schnelllebig
  - eintauchen
  - tauchen sie ein
  - taucht ein
  - ein Muss
  - Magie
  - magisch
  - perfekte Symbiose
  - Symbiose
  - Hochzeitspaket
  - Firmenpaket
  - Pauschalpreis
  - von der Stange
  - kompletten Service zu einem Preis
  - Der Kunde erhält
  - Die Musik wächst mit der Planung
  - bis sie gereift sind
  - gereift
  - Samstage im Sommer
  - Halay
  - türkische Hochzeit
  - Musikbogen
  - Musikfragebogen
  - ankreuzen
  - Spezialist für
  - Tanzfläche zum Beben
  - das gewisse Etwas
  - Traumhochzeit
  - rundum sorglos
  - auf höchstem Niveau
  - Maßstäbe setzen

# name: message shown in reports. pattern: JavaScript regular expression.
forbidden_patterns:
  - { name: '"Hochzeits-DJ" mit Bindestrich', pattern: 'Hochzeits\s*[-‐‑‒–—]\s*DJ' }
  - { name: 'Das Wort "Paket"', pattern: 'paket' }
  - { name: Preisangabe, pattern: '(?:€|\bEUR\b|\d[\d.,]*\s*Euro\b|\bEuro\b)' }
  - { name: Hinweis auf Umsatzsteuer, pattern: '\b(?:MwSt|Mehrwertsteuer|Umsatzsteuer|USt|UStG|Kleinunternehmer)\b|§\s*19' }
  - { name: Uhrzeit, pattern: '\b\d{1,2}[:.]\d{2}\s*(?:Uhr|h)\b|\b\d{1,2}\s*Uhr\b|\b(?:um|ab|gegen|bis)\s+\d{1,2}[:.]\d{2}\b' }

# Each key fact may appear at most this often in the body and FAQ together: once in each.
# A sentence counts once, however often it matches.
key_fact_max: 2
key_facts:
  - { name: '"6 bis 12 Monate"', pattern: '6 bis 12 Monate' }
  - { name: '"etwa 6 Monate"', pattern: 'etwa 6 Monate' }
  - { name: 'Kurzfristige Anfragen', pattern: 'kurzfristig|spontan' }
  - { name: 'An allen Wochentagen buchbar', pattern: 'allen Wochentagen' }
  - { name: 'Preisfaktoren', pattern: 'Spielzeit, Gästezahl' }
  - { name: 'Individuelles Angebot', pattern: 'individuelles Angebot' }
  - { name: 'Inhalt des Vorgesprächs', pattern: 'Ablauf, Musikrichtungen' }
  - { name: 'Kein Fragebogen für Kunden', pattern: 'Fragebogen|nichts ausfüllen|nichts ankreuzen|eigenen Notizen' }
  - { name: 'Technik für 250 Gäste', pattern: '250 Gäste' }
  - { name: 'Zwei Funkmikrofone', pattern: 'zwei Funkmikrofone' }
  - { name: 'Einsatzgebiet', pattern: 'Norderstedt, Pinneberg' }
  - { name: 'Erfahrung', pattern: 'über 10 Jahre' }

# The list of international music styles: only in the "musik" category, and in one sentence at most.
music_styles:
  pattern: 'türkisch|italienisch|französisch|persisch|russisch|arabisch|Balkan'
  min_matches: 2
  allowed_categories: [musik]

# Claims about the business with a number must match one of these.
allowed_number_claims:
  - 'über 10 Jahre'
  - 'über 10 Jahren'
  - '250\+? Events'
  - '250 Gäste'
  - 'zwei Funkmikrofone'
  - '6 bis 12 Monate'
  - 'etwa 6 Monate'
  - '50 km'
  - '50 Kilometer'
