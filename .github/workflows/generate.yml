# Creates the next article and opens a Pull Request. Started by the scheduler, or by hand
# with "Run workflow". With DRY_RUN on, it writes a report and changes nothing.
#
# Up to 5 Claude attempts per slot. Temporary errors are retried inside each step, a usage
# limit pauses the slot for an hour (at most 6 times), and problems a retry can't fix stop
# the run with one Issue. See config/schedule.yml → retries.
name: Generate article

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Test run only (nothing is saved or published)
        type: boolean
        default: true
      slot:
        description: Leave empty
        type: string
        default: ""
      limit_retry:
        description: Leave at 0
        type: string
        default: "0"
      simulate:
        description: "Test only: simulate a problem (always a test run)"
        type: choice
        options: [none, quality, "503", auth]
        default: none

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Starts Publish straight away when a late article's publish slot has already passed.
  actions: write

concurrency:
  group: generate
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  DRY_RUN: ${{ vars.DRY_RUN }}
  # A simulation is always a test run.
  DRY_RUN_INPUT: ${{ inputs.dry_run || (inputs.simulate != '' && inputs.simulate != 'none') }}
  SIMULATE: ${{ inputs.simulate }}
  # Only true or false is passed, never the secret itself.
  HAS_CLAUDE_CREDENTIAL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
  AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
  SLOT: ${{ inputs.slot }}
  LIMIT_RETRY: ${{ inputs.limit_retry }}
  UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
  GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}

jobs:
  generate:
    if: github.repository == 'DJMOSTAR/djmostar-blog'
    runs-on: ubuntu-latest
    # Room for 5 attempts plus waits of 2, 5 and 15 minutes after temporary errors.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Check limits and prepare
        id: prepare
        run: node scripts/generate-prepare.js

      - name: Plan new topics
        if: steps.prepare.outputs.need_topics == 'true'
        uses: ./.github/actions/claude-step
        with:
          step_name: topics
          prompt_file: .work/prompt-topics.md
          schema_file: .work/schema-topics.json
          output_file: .work/out-topics.json
          model: ${{ steps.prepare.outputs.model }}
          max_turns: ${{ steps.prepare.outputs.turns_topics }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}

      - name: Pick the topic, keywords and photos
        id: article
        if: steps.prepare.outputs.run == 'true'
        run: node scripts/prepare-article.js

      # Up to 5 attempts. Each step skips itself once an article has passed or the run has stopped.
      - name: Attempt 1 (new article)
        if: steps.article.outputs.ready == 'true'
        uses: ./.github/actions/article-pass
        with:
          pass: "1"
          model: ${{ steps.prepare.outputs.model }}
          turns_writer: ${{ steps.prepare.outputs.turns_writer }}
          turns_editor: ${{ steps.prepare.outputs.turns_editor }}
          simulate: ${{ steps.prepare.outputs.simulate }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
      - name: Attempt 2 (fix the failed checks)
        if: steps.article.outputs.ready == 'true'
        uses: ./.github/actions/article-pass
        with:
          pass: "2"
          model: ${{ steps.prepare.outputs.model }}
          turns_writer: ${{ steps.prepare.outputs.turns_writer }}
          turns_editor: ${{ steps.prepare.outputs.turns_editor }}
          simulate: ${{ steps.prepare.outputs.simulate }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
      - name: Attempt 3 (new article, same topic)
        if: steps.article.outputs.ready == 'true'
        uses: ./.github/actions/article-pass
        with:
          pass: "3"
          model: ${{ steps.prepare.outputs.model }}
          turns_writer: ${{ steps.prepare.outputs.turns_writer }}
          turns_editor: ${{ steps.prepare.outputs.turns_editor }}
          simulate: ${{ steps.prepare.outputs.simulate }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
      - name: Attempt 4 (next topic)
        if: steps.article.outputs.ready == 'true'
        uses: ./.github/actions/article-pass
        with:
          pass: "4"
          model: ${{ steps.prepare.outputs.model }}
          turns_writer: ${{ steps.prepare.outputs.turns_writer }}
          turns_editor: ${{ steps.prepare.outputs.turns_editor }}
          simulate: ${{ steps.prepare.outputs.simulate }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
      - name: Attempt 5 (next topic)
        if: steps.article.outputs.ready == 'true'
        uses: ./.github/actions/article-pass
        with:
          pass: "5"
          model: ${{ steps.prepare.outputs.model }}
          turns_writer: ${{ steps.prepare.outputs.turns_writer }}
          turns_editor: ${{ steps.prepare.outputs.turns_editor }}
          simulate: ${{ steps.prepare.outputs.simulate }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}

      - name: Open the Pull Request, pause, or stop with a notice
        if: steps.prepare.outputs.run == 'true'
        run: node scripts/finish-generate.js

      - name: Save the test run's report
        if: always() && hashFiles('.work/preview/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: testlauf
          path: .work/preview/
          include-hidden-files: true
          retention-days: 14

      - name: Report a crash
        if: failure()
        env:
          WORKFLOW_NAME: Artikel erstellen
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-failure.js
